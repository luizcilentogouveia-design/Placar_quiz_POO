<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar POO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Placar da Competição</h1>
        
        <!-- Formulário para adicionar jogador -->
        <div class="form-grupo">
            <input type="text" id="nomeJogador" placeholder="Nome do Jogador">
            <button id="btnAdicionar">Adicionar Jogador</button>
        </div>

        <!-- Tabela ou Lista de Jogadores -->
        <div class="placar-container">
            <h2>Jogadores</h2>
            <ul id="listaJogadores">
                <!-- Os jogadores aparecerão aqui dinamicamente -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
